<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="元画像の解像度を保って16:9・9:16に切り抜く、ブラウザ完結のThumbnail Maker。">
    <title>Thumbnail Maker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div>
            <p class="kicker">A LITTLE CROP. A NEW PERSPECTIVE.</p>
            <h1>Thumbnail Maker</h1>
            <p class="intro">お気に入りの一枚を、ちょうどいい比率に。<br>元の解像度を保って、横にも縦にも切り抜き。</p>
          </div>
          <img src="assets/title-characters.png" width="1254" height="1254" alt="冒険者のエルフ二人">
        </div>
        <span class="local">画像は端末の中だけで処理</span>
      </header>
      <div class="workspace">
        <section class="stage" id="dropZone" aria-label="画像の読み込みとプレビュー">
          <span class="stage-label">PREVIEW</span>
          <div class="empty" id="emptyState">
            <button class="pick" id="pickButton" type="button">画像を選ぶ</button>
            <p>画像をドラッグ＆ドロップ<br>JPEG・PNG・WebPなどに対応</p>
          </div>
          <div class="preview-wrap" id="previewWrap" hidden>
            <canvas id="canvas" aria-label="切り抜き後のプレビュー"></canvas>
          </div>
        </section>
        <aside class="panel" aria-label="切り抜き設定">
          <div>
            <p class="section-label">01 / 切り抜く比率</p>
            <div class="ratios" role="group" aria-label="アスペクト比">
              <button class="ratio" type="button" data-ratio="landscape" aria-pressed="true">
                <span class="shape-box">
                  <span class="shape"></span>
                </span>16:9<small>横長</small>
              </button>
              <button class="ratio" type="button" data-ratio="portrait" aria-pressed="false">
                <span class="shape-box">
                  <span class="shape portrait"></span>
                </span>9:16<small>縦長</small>
              </button>
            </div>
          </div>
          <div class="divider">
            <div class="position-heading">
              <label for="position">02 / 切り抜き位置</label>
              <output id="positionLabel" for="position">中央</output>
            </div>
            <input id="position" type="range" min="0" max="100" value="50" disabled>
            <div class="ends">
              <span id="startLabel">上 / 左</span>
              <span id="endLabel">下 / 右</span>
            </div>
          </div>
          <div class="details">
            <p class="filename" id="filename">画像が選択されていません</p>
            <div class="detail">
              <span>元のサイズ</span>
              <strong id="sourceSize">—</strong>
            </div>
            <div class="detail">
              <span>保存サイズ</span>
              <strong id="outputSize">—</strong>
            </div>
          </div>
          <p class="notice" id="notice" role="status">拡大・縮小せず、選んだ比率で切り抜きます。</p>
          <div class="actions">
            <button class="download" id="downloadButton" type="button" disabled>PNGを保存 ↓</button>
            <div class="secondary">
              <button id="replaceButton" type="button">画像を選び直す</button>
              <button class="remove" id="removeButton" type="button" disabled>画像を消す</button>
            </div>
          </div>
        </aside>
      </div>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
